[project]
name = "planner-service"
version = "0.1.0"
description = "AgroPilot planner service: a daily irrigation plan per plot from an FAO-56 soil-water bucket."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "httpx~=0.28",
    "pydantic-settings~=2.16",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest~=9.2",
]
