[project]
name = "registry-service"
version = "0.1.0"
description = "AgroPilot registry service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "psycopg[binary]~=3.3",
    "python-dotenv>=1.2.4",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx~=0.28",
    "pytest~=9.2",
]
