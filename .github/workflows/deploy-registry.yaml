name: deploy-registry

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy registry-service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            DB_PASSWORD=$(printf '%s' '${{ secrets.DB_PASSWORD }}' | tr -d '\r\n')
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            fi
            sudo systemctl enable --now docker

            if ! sudo docker ps -a --format '{{.Names}}' | grep -qx registry-db; then
              sudo docker run -d --name registry-db --restart unless-stopped \
                -e POSTGRES_USER=registry \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                -e POSTGRES_DB=registry \
                -v registry-pgdata:/var/lib/postgresql/data \
                -p 127.0.0.1:5432:5432 \
                postgres:17
            fi
            sudo docker start registry-db

            for i in $(seq 1 30); do
              sudo docker exec registry-db pg_isready -U registry && break
              sleep 1
            done

            if [ ! -d /home/ubuntu/ArgoPilot/.git ]; then
              git clone https://github.com/asafpo4/ArgoPilot.git /home/ubuntu/ArgoPilot
            fi
            cd /home/ubuntu/ArgoPilot
            git fetch origin main
            git reset --hard ${{ github.sha }}
            cd services/registry-service

            if [ ! -x /home/ubuntu/.local/bin/uv ]; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            /home/ubuntu/.local/bin/uv sync --locked

            printf 'DATABASE_URL=postgresql://registry:%s@127.0.0.1:5432/registry\n' "$DB_PASSWORD" > .env
            chmod 600 .env

            if [ -z "$(sudo docker exec registry-db psql -U registry -d registry -tAc "SELECT to_regclass('public.farms')")" ]; then
              /home/ubuntu/.local/bin/uv run python scripts/seed.py
            fi

            sudo cp registry.service /etc/systemd/system/registry.service
            sudo systemctl daemon-reload
            sudo systemctl enable registry.service
            sudo systemctl restart registry.service

            cd /home/ubuntu/ArgoPilot/services/weather-service
            /home/ubuntu/.local/bin/uv sync --locked
            cp .env.example .env
            chmod 600 .env
            sudo cp weather.service /etc/systemd/system/weather.service

            cd /home/ubuntu/ArgoPilot/services/planner-service
            /home/ubuntu/.local/bin/uv sync --locked
            cp .env.example .env
            chmod 600 .env
            sudo cp planner.service /etc/systemd/system/planner.service

            sudo systemctl daemon-reload
            sudo systemctl enable weather.service planner.service
            sudo systemctl restart weather.service planner.service

            if ! command -v npm >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm
            fi

            cd /home/ubuntu/ArgoPilot/services/frontend
            sudo chown -R ubuntu:ubuntu /home/ubuntu/ArgoPilot/services/frontend
            cp .env.example .env.local
            chmod 600 .env.local
            npm ci
            npm run build
            sudo cp frontend.service /etc/systemd/system/frontend.service
            sudo systemctl daemon-reload
            sudo systemctl enable frontend.service
            sudo systemctl restart frontend.service

            for port in 8000 8001 8002; do
              ok=0
              for i in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:$port/health > /dev/null; then
                  ok=1
                  break
                fi
                sleep 2
              done
              if [ "$ok" != 1 ]; then
                echo "the service on port $port did not become healthy"
                exit 1
              fi
            done

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                exit 0
              fi
              sleep 2
            done
            echo "the frontend did not become healthy"
            exit 1